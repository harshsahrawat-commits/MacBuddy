name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ARM64 build and isolated checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Record environment
        run: |
          uname -m
          sw_vers
          swift --version
          xcode-select -p
          test "$(uname -m)" = arm64
      - name: Build and verify local bundle
        run: ./scripts/build.sh
      - name: Installer transactions and Git updates
        run: python3 scripts/install-checks.py
      - name: Compile native installer lifecycle helper
        run: |
          mkdir -p tmp
          xcrun swiftc -swift-version 5 -O -module-cache-path .build/module-cache scripts/install-lifecycle.swift -o tmp/install-lifecycle-check
      - name: Functional and native regression checks
        run: ./scripts/check.sh
      - name: Extended scheduler checks
        run: ./scripts/scheduler-check.sh
      - name: Packaged runtime integration
        run: '"dist/Mac Buddy.app/Contents/MacOS/MacBuddy" --runtime-checks'
